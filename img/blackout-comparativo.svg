<!-- Placeholder comparativo — trocar por foto/gif real de contra-luz -->
<svg viewBox="0 0 480 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Comparativo: etiqueta comum deixa luz passar e desbota; etiqueta blackout bloqueia 100% da luz">
  <rect width="480" height="270" fill="#0B0D10"/>
  <line x1="240" y1="0" x2="240" y2="270" stroke="#262B33" stroke-width="2"/>

  <!-- Lado esquerdo: etiqueta comum -->
