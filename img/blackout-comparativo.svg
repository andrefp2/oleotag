  <circle cx="205" cy="230" r="12" fill="none" stroke="#EF4444" stroke-width="3"/>
  <line x1="197" y1="222" x2="213" y2="238" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>

  <!-- Lado direito: etiqueta blackout -->
  <text x="360" y="30" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5A524" letter-spacing="1">NOSSA ETIQUETA</text>
  <circle cx="360" cy="70" r="18" fill="#F5A524"/>
  <g stroke="#F5A524" stroke-width="2">
    <line x1="360" y1="90" x2="330" y2="148"/>
    <line x1="360" y1="90" x2="360" y2="148"/>
    <line x1="360" y1="90" x2="390" y2="148"/>
  </g>
  <rect x="315" y="150" width="90" height="55" rx="6" fill="#050607" stroke="#F5A524" stroke-width="2"/>
  <text x="360" y="182" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F3F4F6">00/00/0000</text>
  <circle cx="405" cy="230" r="12" fill="none" stroke="#22C55E" stroke-width="3"/>
