  <circle cx="120" cy="70" r="18" fill="#F5A524" opacity="0.8"/>
  <g stroke="#F5A524" stroke-width="2" opacity="0.5">
    <line x1="120" y1="90" x2="90" y2="150"/>
    <line x1="120" y1="90" x2="120" y2="150"/>
    <line x1="120" y1="90" x2="150" y2="150"/>
  </g>
  <rect x="75" y="150" width="90" height="55" rx="6" fill="#3a3f47" opacity="0.55" stroke="#4b515b"/>
